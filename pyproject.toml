[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoheldi-ml"
version = "0.1.0"
description = "Leakage-resistant grouped machine-learning workflows for NanoHELDI-MS pain studies"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sijie Ji"}]
dependencies = [
  "joblib>=1.2,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.2,<2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0,<4"]
dev = ["pytest>=7,<9", "ruff>=0.6,<1"]

[project.scripts]
nanoheldi-evaluate = "nanoheldi_ml.cli:main"
nanoheldi-plot = "nanoheldi_ml.plotting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
